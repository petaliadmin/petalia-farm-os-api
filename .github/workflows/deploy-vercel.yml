name: Deploy Vercel + Supabase

# Runs when repository variable DEPLOY_TARGET is "vercel" or "both".
# Order matters: Supabase migrations first, then the Vercel production
# deployment (automatic Git deployments of main are disabled in vercel.json
# so the code never goes live before its schema).
#
# Secrets (environment "production"):
#   SUPABASE_DB_MIGRATION_URL  session connection string (port 5432)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate Supabase & deploy Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: >-
      (vars.DEPLOY_TARGET == 'vercel' || vars.DEPLOY_TARGET == 'both') &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify secrets
        env:
          SUPABASE_DB_MIGRATION_URL: ${{ secrets.SUPABASE_DB_MIGRATION_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          for v in SUPABASE_DB_MIGRATION_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing in environment 'production'."; missing=1; fi
          done
          exit $missing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Supabase migrations
        run: npm run migration:run:prod
        env:
          NODE_ENV: production
          DATABASE_MIGRATION_URL: ${{ secrets.SUPABASE_DB_MIGRATION_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
